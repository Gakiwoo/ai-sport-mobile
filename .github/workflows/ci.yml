name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # @ai-sport/core 为 file:../packages/ai-sport-core 依赖，且 jest moduleNameMapper /
      # metro watchFolders 直接引用 ../packages/ai-sport-core——独立 checkout 本仓库时
      # 该目录不存在，npm ci 必然失败。从父仓库（ai-sport-system）拉取 core 源码。
      - name: Fetch @ai-sport/core source from parent repo
        uses: actions/checkout@v4
        with:
          repository: Gakiwoo/ai-sport-system
          path: parent
          sparse-checkout: packages/ai-sport-core

      - name: Place @ai-sport/core source
        run: |
          mkdir -p ../packages
          cp -r parent/packages/ai-sport-core ../packages/
          rm -rf parent

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
